<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="PRISMA — editor de video por conversa">
  <rect width="1280" height="320" fill="#07080a"/>
  <g transform="translate(205 48) scale(3.2)">
  <!-- Third pass. What the second got wrong, seen at 200px:
       · the steel blades sat at 0.42-0.55 opacity and disappeared into the
         background — the iris read as two coloured wedges floating in a ring;
       · the warm and cool blades were flat fills, so they read as pie chart;
       · the centre was a 6.4r black hole, heavy enough to become the subject.

       Fixes: every blade is now metal (a real gradient, no opacity trick), the
       spectrum enters as a RIM on two blade edges rather than as a fill, and the
       opening shrinks to r=4.6 so the mechanism is the subject, not the void. -->
  <defs>
    <!-- brushed metal, lit from upper-left like the rest of the UI -->
    <linearGradient id="q-steel" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0%"   stop-color="#e8edf4"/>
      <stop offset="42%"  stop-color="#aab4c2"/>
      <stop offset="100%" stop-color="#69737f"/>
    </linearGradient>
    <linearGradient id="q-steel-dim" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0%"   stop-color="#c3ccd8"/>
      <stop offset="45%"  stop-color="#8c96a3"/>
      <stop offset="100%" stop-color="#525b66"/>
    </linearGradient>
    <!-- the spectrum, as light caught on an edge -->
    <linearGradient id="q-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc08a"/>
      <stop offset="55%" stop-color="#ff8f43"/>
      <stop offset="100%" stop-color="#e8641b"/>
    </linearGradient>
    <linearGradient id="q-cool" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a6c4ff"/>
      <stop offset="55%" stop-color="#6fb9e8"/>
      <stop offset="100%" stop-color="#54cdb0"/>
    </linearGradient>
    <path id="q-blade" d="M0 -20.4 A20.4 20.4 0 0 1 17.67 -10.2 L1.55 -5.05 A5.8 5.8 0 0 0 -1.95 -7.1 Z"/>
  </defs>

  <g transform="translate(33 32)">
    <!-- barrel -->
    <circle r="25.2" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/>
    <circle r="22.1" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="1.2"/>

    <!-- six blades. Alternating steel tones give the iris depth without any
         blade vanishing; the dark separator stroke is what makes them read as
         overlapping plates instead of one disc. -->
    <g stroke="rgba(8,10,14,.62)" stroke-width=".85" stroke-linejoin="round">
      <use href="#q-blade" fill="url(#q-steel)"     transform="rotate(0)"/>
      <use href="#q-blade" fill="url(#q-steel-dim)" transform="rotate(60)"/>
      <use href="#q-blade" fill="url(#q-steel)"     transform="rotate(120)"/>
      <use href="#q-blade" fill="url(#q-steel-dim)" transform="rotate(180)"/>
      <use href="#q-blade" fill="url(#q-steel)"     transform="rotate(240)"/>
      <use href="#q-blade" fill="url(#q-steel-dim)" transform="rotate(300)"/>
    </g>

    <!-- dispersion: two arcs riding the outer edge, warm and cool on opposite
         sides. This is the whole brand statement — light split by an optic —
         and it costs two strokes instead of two filled wedges. -->
    <g fill="none" stroke-width="2.6" stroke-linecap="round">
      <path d="M-1.5 -20.6 A20.7 20.7 0 0 1 17.2 -11.4" stroke="url(#q-warm)"/>
      <path d="M1.5 20.6 A20.7 20.7 0 0 1 -17.2 11.4" stroke="url(#q-cool)"/>
    </g>

    <!-- the opening: small, with a specular arc so it reads as glass -->
    <circle r="4.6" fill="#06070a"/>
    <path d="M-3.3 -3.2 A4.6 4.6 0 0 1 1.2 -4.45" fill="none"
          stroke="rgba(255,255,255,.62)" stroke-width=".95" stroke-linecap="round"/>
  </g>

  <text x="72" y="39.5"
        font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
        font-size="27" font-weight="300" letter-spacing="10"
        fill="#f4f7fa">PRISM<tspan letter-spacing="0">A</tspan></text>
</g>
  <text x="640" y="282" text-anchor="middle" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#8a94a0" letter-spacing="2">editor de vídeo por conversa</text>
</svg>
